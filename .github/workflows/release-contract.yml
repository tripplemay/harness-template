name: Release Contract

on:
  pull_request: {}
  push:
    branches: [main]
    paths:
      - VERSION
      - CHANGELOG.md
      - harness/framework-releases.json
      - harness/framework-versioning.md
      - scripts/validate-framework-release-contract.py
      - tests/test-framework-release-contract.py
      - templates/claude/harness.sh
      - bootstrap.sh
      - .github/workflows/release-contract.yml
      - contract-fixtures/**
      - scripts/validate-contract-fixtures.py
      - tests/test-contract-fixtures.py
      - templates/claude/console/**

jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/validate-framework-release-contract.py
      - run: python3 tests/test-framework-release-contract.py
      - run: python3 scripts/validate-contract-fixtures.py
      - run: python3 tests/test-contract-fixtures.py
